        <span class="material-symbols-outlined text-[22px]">arrow_back</span>
      </a>
      <div class="flex flex-col min-w-0">
        <span class="font-headline-sm text-headline-sm text-on-surface tracking-tight leading-tight truncate">Detalle</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">SENSA</span>
      </div>
    </div>
    <div class="flex items-center gap-space-sm">

        <span class="hidden sm:inline font-label-md text-label-md text-on-surface font-bold">Pedido</span>

      <a href="/" aria-label="SENSA, ir al inicio" class="p-1 rounded-full bg-surface-container-low"><img src="/images/opt/logo.webp" alt="" width="36" height="36" class="w-9 h-9 object-contain"></a>
    </div>
  </div>

<main class="pt-16 pb-space-xl">
  <div id="product-root" class="max-w-[1280px] mx-auto px-margin-sm lg:px-margin-lg">
    <p class="py-space-xl text-center text-on-surface-variant">Cargando producto…</p>
  </div>
</main>

<footer class="bg-surface-container-high rounded-t-lg pt-space-lg pb-space-lg">
  <div class="max-w-[1280px] mx-auto px-margin-sm lg:px-margin-lg flex flex-col items-center text-center gap-space-sm">
